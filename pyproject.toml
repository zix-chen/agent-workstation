[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workstation"
version = "0.1.0"
description = "API/CLI-first MCP workstation adapter with explicit host trust and bounded context"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "zix-chen"}]
dependencies = [
  "coding-tools-mcp @ git+https://github.com/xyTom/coding-tools-mcp.git@bedb632e1afd2e9ec9b268a50fe0b04695c22c64",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
agent-workstation = "agent_workstation.cli:main"

[project.urls]
Repository = "https://github.com/zix-chen/agent-workstation"
Issues = "https://github.com/zix-chen/agent-workstation/issues"

[tool.setuptools.packages.find]
include = ["agent_workstation*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
